name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Configure browser
        run: |
          grantweave_browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$grantweave_browser_path" ]; then
            printf 'PLAYWRIGHT_EXECUTABLE_PATH=%s\n' "$grantweave_browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:browser
